[coincidences]
refr = 50                 ; reference frame
cthr = 14.5               ; Fstatistic threshold for coincidences
scalem = 2                ; cell scale factor for m
scalen = 2                ; cell scale factor for n
scales = 8                ; cell scale factor for s
scalef = 256              ; cell scale factor for fbin
shift =                   ; cell shifts, if empty loop over all 16 permutations
mincoin = 4               ; minimum number of coincidences to register
out_dir = .               ; output directory, cwd by default
trig_dset = triggers      ; triggers dataset name (triggers||inj_X)
coinc_dset = coinc_       ; write coincidences to dataset: coinc_{shift}
calc_fap = 1              ; calculate FAP for coincidences
write_coin = 1            ; write coincidences to HDF file
write_ctrigs = 0          ; write shifted triggers to HDF file
