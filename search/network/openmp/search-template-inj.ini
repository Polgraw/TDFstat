[search]
indir = /work/chuck/virgo/O4/input_data_O4_G02/xdat_O4_6d  # input data directory (string)
outdir = O4-allsky         # output directory (string)
band = 17	      # band number (int)
seg = 1	              # segment number (int)
hemi = 1              # hemisphere [1,2 or 0 for both] (int)
thr = 14.5            # fstatistic threshold of candidates (double)
nod = 6               # length of input time series [days] (int)
dt = 0.5                # input time series sampling interval [seconds] (double)
overlap = 0.0625         # bands overlap, band frequency fpo=10+(1-overlap)*B/(2*dt) (double)
narrowdown = -1       # output range of f [0-0.5], if < 0 it is calculated from overlap (double)
fstat_norm =          # fstatistic normalization (NULL=white noise or blocks_avg)
grid_file = 020/grids/grid_020_0017_H1L1.bin

# optional
usedet =              # use only specified detectors
#addsig =              # name of the file with signals to be injected
mods =                # modifiers list {read_O3}
label =               # run label

# flags
veto_flag = 0         # veto lines: 0-no, 1-yes
checkp_flag = 0       # write checkpoint file on every triggers buffer flush

[injections]
# use_amp: 3rd column in signal params contains 1 - amplitude , 0 - SNR
use_amp = 1
# inj_mode: single - separate run+dataset for each injection; multi - inject all at once, create one dataset; empty - no injection
inj_mode = single
inj_file = sig1.dat #  filename with signals to inject
inj_dict = # just sinle injection line in the same format as in the file


[grid]
# Format specification:
# gtype = allsky || allsky_range || directed_range
# gcenter = f fdot ra dec || inj || pulsarX
# gsizes = f_range fdot_range mm_range nn_range
# gsteps = f_step fdot_step mm_step nn_step
#
# allsky - all-sky search on "integer" grid; gcenter, gsizes, gsteps are ignored
# allsky_range - grid range centered at the nearest "integer" grid point to gcenter
# directed_range - grid range centered exactly at gcenter
#
# Units: f [Hz], fdot [Hz/s], ra and dec [radians]
#        granges and gsteps are float numbers in units of 1,
#        except of f which is integer.
#        f_step is always reset to 1.

gtype = allsky
#gcenter = 26.332768  -8.50e-11 3.86687548714555 0.74835013347064 # pulsar10
gcenter = 26.321649  -8.50e-11 3.86687548714555 0.74835013347064 # pulsar10
gsizes = 16256 0. 0. 0.
gsteps = 1 1. 1. 1.
